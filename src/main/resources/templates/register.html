<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3C9FCSTWY3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-3C9FCSTWY3');
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Register | CampusHive</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: { extend: {
                    colors: { ink: "#0B1526", "ink-soft": "#14213B", canvas: "#FFFFFF", "canvas-sunk": "#F5F7FA", "canvas-mid": "#EEF1F6", line: "#E2E6ED", "line-strong": "#CBD2DE", muted: "#5B6B85", "muted-dim": "#8894A8", action: "#2450E8", "action-hover": "#1A3FC4", "action-tint": "#EDF1FE", signal: "#0EA5A5", "signal-tint": "#E7F8F8", amber: "#B45309", danger: "#B42318" },
                    fontFamily: { display: ["Sora", "sans-serif"], body: ["Inter", "sans-serif"], mono: ["IBM Plex Mono", "monospace"] },
                    spacing: { "container-max": "1360px" },
                    borderRadius: { DEFAULT: "8px", lg: "10px", xl: "14px" }
                }}
        };
    </script>
    <style>
        body { background: #F5F7FA; color: #0B1526; font-family: Inter, sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .eyebrow { font-family: 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
        .input-icon-wrapper i { color: #8894A8; transition: color 0.2s; }
        input:focus + i { color: #2450E8; }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between overflow-x-hidden font-body">

<!-- Header -->
<header class="fixed top-0 w-full z-50 border-b border-line bg-canvas/85 backdrop-blur-md">
    <div class="flex justify-between items-center h-16 px-4 md:px-8 max-w-container-max mx-auto">
        <a href="/" class="flex items-center gap-2 group">
            <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-ink font-display text-base font-bold text-white shadow-md group-hover:scale-105 transition-transform">
                CH
            </span>
            <span class="font-display text-lg font-bold tracking-tight text-ink">
                <span>Campus</span><span class="text-action">Hive</span>
            </span>
        </a>
        <div class="flex gap-4 items-center text-sm font-semibold">
            <a class="text-muted hover:text-ink transition-colors" href="#">Support</a>
            <a class="text-muted hover:text-ink transition-colors" href="/about-us">About</a>
            <a class="text-action hover:text-action-hover" href="/login">Sign In</a>
        </div>
    </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-12 pt-24">
    <div class="w-full max-w-md">
        <div class="bg-canvas border border-line rounded-xl shadow-md p-6 md:p-8 space-y-6 relative">

            <div class="text-center space-y-1">
                <h1 class="text-xl font-bold text-ink font-display">Create Account</h1>
                <p class="text-xs text-muted">Join CampusHive and start booking events.</p>
            </div>

            <!-- Error banner -->
            <div id="error-banner" class="hidden p-4 rounded-lg bg-red-50 border border-red-200 text-danger text-xs font-semibold flex items-center gap-2 shadow-inner">
                <span class="material-symbols-outlined text-[18px]">error</span>
                <span class="error-msg flex-1"></span>
            </div>

            <!-- Google OAuth -->
            <a href="/oauth2/authorization/google" class="w-full flex items-center justify-center gap-2.5 border border-line bg-canvas hover:bg-canvas-sunk text-ink font-semibold px-4 py-2.5 rounded-lg text-sm transition-all shadow-sm">
                <svg class="w-5 h-5 shrink-0" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4c-7.7 0-14.4 4.3-17.7 10.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.9 14.1-5.1l-6.5-5.5C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.5C40.9 36.5 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
                </svg>
                <span>Continue with Google</span>
            </a>

            <div class="flex items-center gap-3">
                <div class="flex-1 h-px bg-line"></div>
                <span class="text-[10px] text-muted-dim font-bold uppercase tracking-wider font-mono">or</span>
                <div class="flex-1 h-px bg-line"></div>
            </div>

            <!-- Register Form -->
            <form id="register-form" class="space-y-4" novalidate>
                <div class="space-y-1">
                    <label for="name" class="block text-xs font-bold text-ink uppercase tracking-wider eyebrow">Full Name</label>
                    <div class="relative input-icon-wrapper flex items-center">
                        <input id="name" name="name" type="text" required autocomplete="name"
                               class="w-full bg-canvas-sunk border border-line rounded-lg pl-10 pr-4 py-2.5 text-xs text-ink placeholder:text-muted/50 focus:border-action focus:ring-action transition-all"
                               placeholder="Jane Doe" />
                        <i class="fa-solid fa-user absolute left-3.5 text-sm"></i>
                    </div>
                </div>
                <div class="space-y-1">
                    <label for="email" class="block text-xs font-bold text-ink uppercase tracking-wider eyebrow">Email</label>
                    <div class="relative input-icon-wrapper flex items-center">
                        <input id="email" name="email" type="email" required autocomplete="email"
                               class="w-full bg-canvas-sunk border border-line rounded-lg pl-10 pr-4 py-2.5 text-xs text-ink placeholder:text-muted/50 focus:border-action focus:ring-action transition-all"
                               placeholder="student@gmail.com" />
                        <i class="fa-solid fa-envelope absolute left-3.5 text-sm"></i>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label for="password" class="block text-xs font-bold text-ink uppercase tracking-wider eyebrow">Password</label>
                        <div class="relative input-icon-wrapper flex items-center">
                            <input id="password" name="password" type="password" required minlength="4" autocomplete="new-password"
                                   class="w-full bg-canvas-sunk border border-line rounded-lg pl-10 pr-4 py-2.5 text-xs text-ink placeholder:text-muted/50 focus:border-action focus:ring-action transition-all"
                                   placeholder="••••••••" />
                            <i class="fa-solid fa-lock absolute left-3.5 text-sm"></i>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label for="confirmPassword" class="block text-xs font-bold text-ink uppercase tracking-wider eyebrow">Confirm Password</label>
                        <div class="relative input-icon-wrapper flex items-center">
                            <input id="confirmPassword" name="confirmPassword" type="password" required minlength="4" autocomplete="new-password"
                                   class="w-full bg-canvas-sunk border border-line rounded-lg pl-10 pr-4 py-2.5 text-xs text-ink placeholder:text-muted/50 focus:border-action focus:ring-action transition-all"
                                   placeholder="••••••••" />
                            <i class="fa-solid fa-shield-halved absolute left-3.5 text-sm"></i>
                        </div>
                    </div>
                </div>

                <button id="submit-btn" type="submit" class="w-full bg-action hover:bg-action-hover text-white font-semibold py-3 px-4 rounded-lg text-sm transition-all shadow-md shadow-action/10 mt-2">
                    Create Account
                </button>
            </form>

            <p class="text-center text-xs text-muted font-medium mt-2">
                Already have an account?
                <a href="/login" class="text-action font-bold hover:underline">Sign in</a>
            </p>
        </div>
    </div>
</main>

<footer class="border-t border-line py-4 bg-canvas/40 text-center text-xs text-muted">
    <div class="max-w-container-max mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-2">
        <p>© 2026 CampusHive. Empowering student engagement.</p>
        <div class="flex gap-4">
            <a href="/about-us" class="hover:text-ink transition-colors">About</a>
            <a href="#" class="hover:text-ink transition-colors">Support</a>
        </div>
    </div>
</footer>

<script src="/js/auth.js"></script>

<script>

    const form =
        document.getElementById("register-form");

    const errorBanner =
        document.getElementById("error-banner");

    const submitBtn =
        document.getElementById("submit-btn");


    // Prevent already authenticated users
    // from opening the registration page.
    checkExistingSessionAndRedirect("/home");


    bindAuthForm({

        formEl: form,

        errorEl: errorBanner,

        buttonEl: submitBtn,

        buttonDefaultText: "Create Account",

        onSubmit: async () => {

            const formData =
                new FormData(form);


            const name =
                formData.get("name").trim();

            const email =
                formData.get("email").trim();

            const password =
                formData.get("password");

            const confirmPassword =
                formData.get("confirmPassword");


            await registerUser({

                name,

                email,

                password,

                confirmPassword

            });


            // Registration succeeded.
            // Backend has sent the OTP.
            window.location.href =
                `/verify-email?email=${encodeURIComponent(email)}`;
        }

    });

</script>
</body>
</html>
