    <style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #0a1310;
            color: #dcebe0;
            font-family: 'Inter', sans-serif;
        }

        .hero-mesh {
            background-image: radial-gradient(at 0% 0%, hsla(158, 64%, 52%, 0.10) 0, transparent 50%),

<body class="dark overflow-x-hidden">
<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-outline-variant">
    <div class="flex justify-between items-center h-16 px-md md:px-lg max-w-container-max mx-auto">
        <a href="/" class="flex items-center gap-3">
            <img src="/images/logo.png" alt="CampusHive Logo" class="w-10 h-10 object-contain"/>
            <span class="text-xl font-bold tracking-tight">
                <span class="text-white">Campus</span><span class="text-primary">Hive</span>
            </span>
        </a>
        <div class="hidden md:flex gap-lg ml-auto items-center">
            <a class="text-on-surface-variant hover:text-primary transition-colors text-body-sm" href="/contact">Contact</a>
            <a class="text-on-surface-variant hover:text-primary transition-colors text-body-sm" href="/aboutUs">About Us</a>
        </div>
    </div>
</header>

<main class="pt-16 min-h-screen flex items-center justify-center hero-mesh px-md py-2xl">
    <div class="w-full max-w-md">
        <div class="bg-surface-container border border-outline-variant rounded-xl shadow-2xl p-xl">
            <div class="text-center mb-lg">
                <span class="material-symbols-outlined text-primary text-[48px] mb-xs animate-bounce">mail</span>
                <h1 class="text-headline-md text-on-background mb-xs font-bold font-sans">Verify Your Email</h1>
                <p class="text-body-sm text-on-surface-variant">We have sent a verification code to <span id="display-email" class="text-on-surface font-semibold">—</span></p>
            </div>

            <!-- Messages banner -->
            <div id="info-banner" class="hidden mb-md p-sm rounded-lg bg-primary/10 border border-primary/30 text-primary text-body-sm"></div>
            <div id="error-banner" class="hidden mb-md p-sm rounded-lg bg-error-container border border-error/30 text-on-error-container text-body-sm"></div>

            <form id="verify-form" class="space-y-md" novalidate>
                <div>
                    <label for="otp" class="block text-body-sm font-medium text-on-surface-variant mb-xs">Verification Code</label>
                    <input id="otp" name="otp" type="text" required maxlength="6" autocomplete="one-time-code"
                           class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm text-on-surface text-center tracking-[0.75em] text-title-lg placeholder:tracking-normal placeholder:text-body-sm focus:border-primary transition-colors"
                           placeholder="Enter 6-digit OTP" />
                </div>

                <button id="verify-btn" type="submit"
                        class="w-full bg-primary hover:bg-primary-fixed text-on-primary font-bold px-lg py-sm rounded-lg transition-all transform hover:scale-[1.01] shadow-lg shadow-primary/20 mt-sm">
                    Verify Code
                </button>
            </form>

            <div class="mt-lg text-center space-y-sm">
                <p class="text-body-sm text-on-surface-variant">
                    Didn't receive the code?
                </p>
                <button id="resend-btn"
                        class="text-primary font-semibold hover:underline text-body-sm focus:outline-none disabled:text-on-surface-variant/40 disabled:no-underline">
                    Resend Code
                </button>
                <p id="timer-text" class="hidden text-body-sm text-on-surface-variant/60"></p>
            </div>
            
            <p class="text-center text-body-sm text-on-surface-variant mt-lg border-t border-outline-variant/30 pt-md">
                <a href="/login" class="text-primary font-semibold hover:underline flex items-center justify-center gap-xs">
                    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    <span>Back to Sign In</span>
                </a>
            </p>
        </div>
    </div>
</main>

<script src="/js/auth.js"></script>
<script>
    const form = document.getElementById("verify-form");
    const displayEmail = document.getElementById("display-email");
    const infoBanner = document.getElementById("info-banner");
    const errorBanner = document.getElementById("error-banner");
    const verifyBtn = document.getElementById("verify-btn");
    const resendBtn = document.getElementById("resend-btn");
    const timerText = document.getElementById("timer-text");

    // Extract email from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get("email");

    if (!email) {
        window.location.href = "/login";
    } else {
        displayEmail.textContent = email;
    }

    // Cooldown logic for resending OTP
    let cooldownSeconds = 0;
    let cooldownInterval = null;

    function startCooldown(seconds) {
        cooldownSeconds = seconds;
        resendBtn.disabled = true;
        timerText.classList.remove("hidden");
        updateCooldownText();

        cooldownInterval = setInterval(() => {
            cooldownSeconds--;
            if (cooldownSeconds <= 0) {
                clearInterval(cooldownInterval);
                resendBtn.disabled = false;
                timerText.classList.add("hidden");
            } else {
                updateCooldownText();
            }
        }, 1000);
    }

    function updateCooldownText() {
        timerText.textContent = `You can request a new code in ${cooldownSeconds}s`;
    }

    // Handle verification submission
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBanner.classList.add("hidden");
        infoBanner.classList.add("hidden");
        errorBanner.textContent = "";

        const otp = document.getElementById("otp").value.trim();
        if (otp.length !== 6 || isNaN(otp)) {
            errorBanner.textContent = "Please enter a valid 6-digit number.";
            errorBanner.classList.remove("hidden");
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = "Verifying...";

        try {
            await verifyEmailOtp({ email, otp });
            infoBanner.textContent = "Verification successful! Redirecting...";
            infoBanner.classList.remove("hidden");
            setTimeout(() => {
                window.location.href = "/home";
            }, 1500);
        } catch (err) {
            errorBanner.textContent = err.message || "Failed to verify. Please try again.";
            errorBanner.classList.remove("hidden");
            verifyBtn.disabled = false;
            verifyBtn.textContent = "Verify Code";
        }
    });

    // Handle Resend OTP click
    resendBtn.addEventListener("click", async () => {
        errorBanner.classList.add("hidden");
        infoBanner.classList.add("hidden");
        
        resendBtn.disabled = true;
        
        try {
            await resendEmailOtp(email);
            infoBanner.textContent = "A new verification code has been sent.";
            infoBanner.classList.remove("hidden");
            startCooldown(60); // 60s cooldown limit
        } catch (err) {
            errorBanner.textContent = err.message || "Failed to resend code.";
            errorBanner.classList.remove("hidden");
            resendBtn.disabled = false;
        }
    });
</script>
</body>

</html>
