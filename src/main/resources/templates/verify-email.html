<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Verify Email | CampusHive</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="icon" href="/images/logo.png" type="image/png" sizes="any">
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { ink: "#0B1526", "ink-soft": "#14213B", canvas: "#FFFFFF", "canvas-sunk": "#F5F7FA", "canvas-mid": "#EEF1F6", line: "#E2E6ED", "line-strong": "#CBD2DE", muted: "#5B6B85", "muted-dim": "#8894A8", action: "#2450E8", "action-hover": "#1A3FC4", "action-tint": "#EDF1FE", signal: "#0EA5A5", "signal-tint": "#E7F8F8", amber: "#B45309", danger: "#B42318" },
                fontFamily: { display: ["Sora", "sans-serif"], body: ["Inter", "sans-serif"], mono: ["IBM Plex Mono", "monospace"] },
                spacing: { "container-max": "1360px" },
                borderRadius: { DEFAULT: "8px", lg: "10px", xl: "14px" }
            }}
        };
    </script>
    <style>
        body { background: #F5F7FA; color: #0B1526; font-family: Inter, sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .eyebrow { font-family: 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between overflow-x-hidden font-body">

<!-- Header -->
<header class="fixed top-0 w-full z-50 border-b border-line bg-canvas/85 backdrop-blur-md">
    <div class="flex justify-between items-center h-16 px-4 md:px-8 max-w-container-max mx-auto">
        <a href="/" class="flex items-center gap-2 group">
            <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-ink font-display text-base font-bold text-white shadow-md group-hover:scale-105 transition-transform">
                CH
            </span>
            <span class="font-display text-lg font-bold tracking-tight text-ink">
                <span>Campus</span><span class="text-action">Hive</span>
            </span>
        </a>
        <div class="flex gap-4 items-center text-sm font-semibold">
            <a class="text-muted hover:text-ink transition-colors" href="#">Support</a>
            <a class="text-muted hover:text-ink transition-colors" href="/about-us">About</a>
        </div>
    </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-12 pt-24">
    <div class="w-full max-w-md">
        <div class="bg-canvas border border-line rounded-xl shadow-md p-6 md:p-8 space-y-6 relative text-center">
            
            <div class="space-y-1.5 flex flex-col items-center">
                <span class="flex h-12 w-12 items-center justify-center rounded-lg bg-action-tint text-action animate-bounce mb-1">
                    <span class="material-symbols-outlined text-[28px]">mail</span>
                </span>
                <h1 class="text-xl font-bold text-ink font-display">Verify Your Email</h1>
                <p class="text-xs text-muted">We have sent a verification code to <span id="display-email" class="text-ink font-bold font-mono">—</span></p>
            </div>

            <!-- Messages banner -->
            <div id="info-banner" class="hidden p-4 rounded-lg bg-green-50 border border-green-200 text-signal text-xs font-semibold flex items-center gap-2 shadow-inner text-left"></div>
            <div id="error-banner" class="hidden p-4 rounded-lg bg-red-50 border border-red-200 text-danger text-xs font-semibold flex items-center gap-2 shadow-inner text-left"></div>

            <form id="verify-form" class="space-y-4" novalidate>
                <div class="space-y-1">
                    <label for="otp" class="block text-xs font-bold text-ink uppercase tracking-wider eyebrow">Verification Code</label>
                    <input id="otp" name="otp" type="text" required maxlength="6" autocomplete="one-time-code"
                           class="w-full bg-canvas-sunk border border-line rounded-lg px-4 py-2.5 text-ink text-center tracking-[0.75em] text-lg font-bold placeholder:tracking-normal placeholder:text-xs focus:border-action focus:ring-action transition-all"
                           placeholder="Enter 6-digit OTP" />
                </div>

                <button id="verify-btn" type="submit" class="w-full bg-action hover:bg-action-hover text-white font-semibold py-3 px-4 rounded-lg text-sm transition-all shadow-md shadow-action/10 mt-2">
                    Verify Code
                </button>
            </form>

            <div class="space-y-2 pt-2 border-t border-line/60">
                <p class="text-xs text-muted font-medium">Didn't receive the code?</p>
                <button id="resend-btn" class="text-action font-bold hover:underline text-xs focus:outline-none disabled:text-muted-dim disabled:no-underline">
                    Resend Code
                </button>
                <p id="timer-text" class="hidden text-xs text-muted-dim font-medium"></p>
            </div>

            <p class="border-t border-line/60 pt-4 text-xs font-semibold">
                <a href="/login" class="text-action font-bold hover:underline inline-flex items-center gap-1">
                    <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    <span>Back to Sign In</span>
                </a>
            </p>
        </div>
    </div>
</main>

<footer class="border-t border-line py-4 bg-canvas/40 text-center text-xs text-muted">
    <div class="max-w-container-max mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-2">
        <p>© 2026 CampusHive. Empowering student engagement.</p>
        <div class="flex gap-4">
            <a href="/about-us" class="hover:text-ink transition-colors">About</a>
            <a href="#" class="hover:text-ink transition-colors">Support</a>
        </div>
    </div>
</footer>

<script src="/js/auth.js"></script>
<script>
    const form = document.getElementById("verify-form");
    const displayEmail = document.getElementById("display-email");
    const infoBanner = document.getElementById("info-banner");
    const errorBanner = document.getElementById("error-banner");
    const verifyBtn = document.getElementById("verify-btn");
    const resendBtn = document.getElementById("resend-btn");
    const timerText = document.getElementById("timer-text");

    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get("email");

    if (!email) {
        window.location.href = "/login";
    } else {
        displayEmail.textContent = email;
    }

    let cooldownSeconds = 0;
    let cooldownInterval = null;

    function startCooldown(seconds) {
        cooldownSeconds = seconds;
        resendBtn.disabled = true;
        timerText.classList.remove("hidden");
        updateCooldownText();

        cooldownInterval = setInterval(() => {
            cooldownSeconds--;
            if (cooldownSeconds <= 0) {
                clearInterval(cooldownInterval);
                resendBtn.disabled = false;
                timerText.classList.add("hidden");
            } else {
                updateCooldownText();
            }
        }, 1000);
    }

    function updateCooldownText() {
        timerText.textContent = `You can request a new code in ${cooldownSeconds}s`;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBanner.classList.add("hidden");
        infoBanner.classList.add("hidden");
        errorBanner.textContent = "";

        const otp = document.getElementById("otp").value.trim();
        if (otp.length !== 6 || isNaN(otp)) {
            errorBanner.textContent = "Please enter a valid 6-digit number.";
            errorBanner.classList.remove("hidden");
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = "Verifying...";

        try {
            await verifyEmailOtp({ email, otp });
            infoBanner.textContent = "Verification successful! Redirecting...";
            infoBanner.classList.remove("hidden");
            setTimeout(() => {
                window.location.href = "/home";
            }, 1500);
        } catch (err) {
            errorBanner.textContent = err.message || "Failed to verify. Please try again.";
            errorBanner.classList.remove("hidden");
            verifyBtn.disabled = false;
            verifyBtn.textContent = "Verify Code";
        }
    });

    resendBtn.addEventListener("click", async () => {
        errorBanner.classList.add("hidden");
        infoBanner.classList.add("hidden");
        resendBtn.disabled = true;
        
        try {
            await resendEmailOtp(email);
            infoBanner.textContent = "A new verification code has been sent.";
            infoBanner.classList.remove("hidden");
            startCooldown(60);
        } catch (err) {
            errorBanner.textContent = err.message || "Failed to resend code.";
            errorBanner.classList.remove("hidden");
            resendBtn.disabled = false;
        }
    });
</script>
</body>
</html>
