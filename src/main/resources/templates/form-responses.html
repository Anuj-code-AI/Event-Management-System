<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3C9FCSTWY3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-3C9FCSTWY3');
    </script>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Registration Responses | CampusHive</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: { extend: {
                    colors: { ink: "#0B1526", "ink-soft": "#14213B", canvas: "#FFFFFF", "canvas-sunk": "#F5F7FA", "canvas-mid": "#EEF1F6", line: "#E2E6ED", "line-strong": "#CBD2DE", muted: "#5B6B85", "muted-dim": "#8894A8", action: "#2450E8", "action-hover": "#1A3FC4", "action-tint": "#EDF1FE", signal: "#0EA5A5", "signal-tint": "#E7F8F8", amber: "#B45309", danger: "#B42318" },
                    fontFamily: { display: ["Sora", "sans-serif"], body: ["Inter", "sans-serif"], mono: ["IBM Plex Mono", "monospace"] },
                    spacing: { "sidebar-w": "256px", "container-max": "1360px" },
                    borderRadius: { DEFAULT: "8px", lg: "10px", xl: "14px" }
                }}
        };
    </script>
    <style>
        body { background: #F5F7FA; color: #0B1526; font-family: Inter, sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .eyebrow { font-family: 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
        #sidebar-nav a { display: flex; align-items: center; gap: .75rem; border: 1px solid transparent; border-radius: 8px; padding: .625rem .75rem; color: #5B6B85; font-size: 14px; font-weight: 500; }
        #sidebar-nav a:hover { background: #F5F7FA; color: #0B1526; }
        #sidebar-nav a.bg-primary\/10 { background: #EDF1FE; border-color: #C8D4FD; color: #2450E8; }
        #sidebar-nav a .material-symbols-outlined { font-size: 20px; }
        #sidebar-auth-actions a:first-child { background: #2450E8; color: #fff; }
        #sidebar-auth-actions a:last-child { border: 1px solid #CBD2DE; color: #0B1526; }
        #sidebar-logout-wrap button { color: #B42318; }
        #sidebar-nav::-webkit-scrollbar { width: 4px; }
        #sidebar-nav::-webkit-scrollbar-thumb { background: #CBD2DE; }
        .skeleton { animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .48; } }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden font-body">

<div id="sidebar-overlay" class="hidden fixed inset-0 bg-ink/40 z-30 md:hidden"></div>

<div class="flex min-h-screen">

    <!-- ===================== SIDEBAR ===================== -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-sidebar-w -translate-x-full flex-col border-r border-line bg-canvas transition-transform duration-200 md:translate-x-0">
        <div class="flex h-16 items-center border-b border-line px-5">
            <a href="/home" class="flex items-center gap-2.5">
                <span class="flex h-8 w-8 items-center justify-center rounded-md bg-ink font-display text-sm font-bold text-white">CH</span>
                <span class="font-display text-lg font-bold tracking-tight text-ink">CampusHive</span>
            </a>
            <button id="sidebar-close" class="ml-auto p-2 text-muted md:hidden" aria-label="Close menu"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="border-b border-line px-5 py-5">
            <a href="/profile" class="flex items-center gap-3">
                <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-action-tint text-action"><span class="material-symbols-outlined">person</span></span>
                <span class="min-w-0">
                    <span id="sidebar-username" class="block truncate text-sm font-semibold text-ink">Loading...</span>
                    <span id="sidebar-role" class="eyebrow mt-0.5 block truncate text-[10px] text-muted">Account</span>
                </span>
            </a>
        </div>
        <nav id="sidebar-nav" class="flex-1 space-y-1 overflow-y-auto px-3 py-4"></nav>
        <div id="sidebar-logout-wrap" class="border-t border-line p-3">
            <button id="logout-btn" class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-red-50"><span class="material-symbols-outlined text-[20px]">logout</span>Sign out</button>
        </div>
    </aside>

    <!-- ===================== MAIN COLUMN ===================== -->
    <div class="flex-1 md:ml-sidebar-w flex flex-col min-w-0">

        <!-- ---------- HEADER ---------- -->
        <header class="sticky top-0 z-20 h-16 border-b border-line bg-canvas/95 backdrop-blur">
            <div class="flex h-full max-w-container-max items-center gap-3 px-4 md:px-8">
                <button id="sidebar-open" class="p-2 text-muted md:hidden" aria-label="Open menu"><span class="material-symbols-outlined">menu</span></button>
                <div class="hidden min-w-0 md:block"><p class="eyebrow text-[10px] text-muted-dim">Dashboard</p><p class="font-display text-sm font-semibold text-ink">Campus Form Responses</p></div>
                <a href="/profile" class="hidden h-9 w-9 items-center justify-center rounded-lg border border-line text-muted hover:border-action hover:text-action sm:flex ml-auto" aria-label="Profile"><span class="material-symbols-outlined text-[20px]">account_circle</span></a>
            </div>
        </header>

        <!-- ---------- MAIN CONTENT ---------- -->
        <main class="flex-1 px-4 py-6 md:px-8 md:py-8 space-y-6">
            <div class="border border-line bg-canvas rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="space-y-1">
                    <div class="flex items-center gap-2 text-action">
                        <span class="material-symbols-outlined text-[24px]">receipt_long</span>
                        <h2 class="text-lg font-bold text-ink">Registration Responses</h2>
                    </div>
                    <p class="text-xs text-muted">
                        Form: <span id="responses-form-title" class="text-ink font-semibold">Loading Form Title...</span>
                    </p>
                </div>
                <div class="flex gap-2">
                    <button id="export-csv-btn" class="bg-action hover:bg-action-hover text-white font-semibold py-2 px-4 rounded-lg text-sm transition-all flex items-center justify-center gap-1.5 shadow-sm">
                        <span class="material-symbols-outlined text-[18px]">download_for_offline</span>
                        <span>Export CSV</span>
                    </button>
                    <a href="/admin" class="border border-line hover:bg-canvas-sunk text-ink font-semibold py-2 px-4 rounded-lg text-sm transition-all flex items-center justify-center gap-1.5">
                        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        <span>Back to Dashboard</span>
                    </a>
                </div>
            </div>

            <!-- Search + page size -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="w-full sm:max-w-md">
                    <label class="relative block w-full">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-muted-dim text-[20px]">search</span>
                        <input id="responseSearch" type="search" placeholder="Search all responses by name or email..." class="w-full rounded-lg border-line bg-canvas py-2 pl-10 pr-4 text-sm text-ink placeholder:text-muted focus:border-action focus:ring-action transition-all" />
                    </label>
                </div>
                <label class="flex items-center gap-2 text-sm text-muted whitespace-nowrap">
                    Show
                    <select id="responses-page-size" class="rounded-lg border-line bg-canvas py-2 pl-2 pr-7 text-sm focus:border-action focus:ring-action">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    per page
                </label>
            </div>

            <!-- Responses Table -->
            <div class="bg-canvas rounded-xl overflow-hidden border border-line shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm" id="responses-table">
                        <thead>
                        <tr class="bg-canvas-sunk border-b border-line text-ink font-semibold uppercase tracking-wider text-[11px] eyebrow" id="responses-table-header">
                            <!-- Populated dynamically -->
                        </tr>
                        </thead>
                        <tbody id="responses-table-body" class="divide-y divide-line">
                        <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div id="responses-pagination" class="hidden flex items-center justify-between border-t border-line pt-4">
                <span id="responses-pagination-info" class="font-mono text-xs text-muted"></span>
                <div class="flex gap-2">
                    <button id="responses-prev-page-btn" class="rounded-lg border border-line-strong bg-canvas px-3 py-2 text-sm font-medium text-ink disabled:opacity-40">Previous</button>
                    <button id="responses-next-page-btn" class="rounded-lg border border-line-strong bg-canvas px-3 py-2 text-sm font-medium text-ink disabled:opacity-40">Next</button>
                </div>
            </div>

            <!-- Responses Empty State -->
            <div id="responses-empty-msg" class="hidden flex flex-col items-center justify-center py-12 text-center space-y-3 bg-canvas border border-line border-dashed rounded-xl p-6">
                <span class="material-symbols-outlined text-[40px] text-muted-dim">feedback</span>
                <p class="text-sm text-muted font-medium">No registrations received yet.</p>
            </div>
        </main>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/auto-refresh.js"></script>
<script src="/js/nav-config.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/form-responses.js"></script>
</body>
</html>
